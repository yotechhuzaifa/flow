version: '3'

vars:
  APP_NAME: "flow"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS. Defaults to host; override with `wails3 task build GOOS=windows`.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Build the application for GOOS (host by default)
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Package a production build for GOOS
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Run the built binary for GOOS
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Hot-reload dev mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:server:
    summary: Headless build, no webview (CI and parity tests)
    cmds:
      - go build -tags server -o {{.BIN_DIR}}/flow-server ./cmd/server

  test:
    summary: Go tests plus frontend typecheck
    cmds:
      - go test -tags server ./... -count=1
      - npm --prefix frontend run -s typecheck
